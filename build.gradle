plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            mods { brbtabs { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { brbtabs { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

// The BRB integration must target the exact 1.20.1 release, not the main
// branch (which now targets a newer Minecraft version).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes('MixinConfigs': 'brbtabs.mixins.json')
    }
}

mixin {
    add sourceSets.main, 'brbtabs.refmap.json'
    config 'brbtabs.mixins.json'
}

jar.finalizedBy('reobfJar')
